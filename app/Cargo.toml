[package]
name = "solidway-app"
version = "0.5.0-rc.2"
edition = "2021"
license = "AGPL-3.0-only"
description = "Solidway 桌面壳：启动并监控 solidway，在 webview 中打开其控制台"

# 独立于仓库根的 crates workspace（根 workspace 已 exclude = ["app"]）
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# 信号处理与 PR_SET_PDEATHSIG（仅 Unix）
[target.'cfg(unix)'.dependencies]
libc = "0.2"
