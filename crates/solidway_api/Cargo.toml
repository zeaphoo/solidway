[package]
name = "solidway-api"
version = "0.5.0-rc.2"
edition.workspace = true
license.workspace = true

[dependencies]
solidway-core = { path = "../solidway_core" }
axum.workspace = true
axum-extra.workspace = true
tower-http.workspace = true
reqwest.workspace = true
sqlx.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
argon2.workspace = true
aes-gcm.workspace = true
hkdf.workspace = true
sha2.workspace = true
hmac.workspace = true
rand.workspace = true
uuid.workspace = true
base64.workspace = true
hex.workspace = true
zeroize.workspace = true
time.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
listeners = "0.3"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
instant-acme = "0.8.5"
rcgen = "0.14.10"
rustls-pemfile = "2"
arc-swap = "1.9.3"
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "http1", "http2", "server"] }
x509-parser = "0.18"
if-addrs = "0.15"
