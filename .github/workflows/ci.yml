name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 干净检出没有 web/dist：开发构建允许缺失（静态资源返回 404），
      # 但 release 构建会因 build.rs 断言而失败，所以这里只跑 debug 测试。
      - run: cargo test --workspace

  windows-app-check:
    name: windows app check
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target
      # 桌面壳是独立 Tauri 项目（不在 workspace 里），Windows 发布由 release.yml
      # 负责打包；这里只做编译检查，避免到打 tag 才发现 Windows 编译不过。
      - name: cargo check
        run: cargo check --manifest-path app/Cargo.toml

  web:
    name: web build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: web
        run: pnpm build

  linux-packages:
    name: linux packages (deb/rpm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install packaging tools
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked
      - name: Build packages
        run: ./scripts/package-linux.sh
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: solidway-linux-packages
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
          if-no-files-found: error
