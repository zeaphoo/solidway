name: Release

# 发布只由 v* 标签触发；workflow_dispatch 仅用于演练（默认不出 Release）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（如 v0.1.0；publish=true 时必填）'
        type: string
        required: false
        default: ''
      publish:
        description: '创建 GitHub Release（否则只上传 artifacts）'
        type: boolean
        default: false
      with_mac:
        description: '构建 macOS 产物（需要签名 secrets）'
        type: boolean
        default: true

# 同一标签的重复推送不互相取消：发布过程不能被并发打断。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  verify:
    name: verify tag & versions
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifests
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          if [[ -n "$tag" ]]; then
            version="$(./scripts/check-release-version.sh "$tag")"
          else
            version="$(./scripts/check-release-version.sh)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release version: $version"
      - name: Check CHANGELOG has this version
        run: ./scripts/release-notes.sh "${{ steps.version.outputs.version }}" > /dev/null

  linux-service:
    name: linux service packages (deb/rpm)
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 缓存 key 必须带镜像标签：aws-lc-sys 等 C 依赖按构建机 glibc 头文件编译，
      # 跨镜像（24.04 → 22.04）复用 target/ 会出现 `__isoc23_*` 未定义符号。
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install packaging tools
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked
      - name: Build packages
        run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-service
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
          if-no-files-found: error

  linux-app:
    name: linux desktop client (deb/AppImage)
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04
          workspaces: |
            . -> target
            app -> target
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            patchelf \
            file
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build client
        run: ./scripts/package-linux-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: dist/linux-app/*
          if-no-files-found: error

  mac:
    name: macos client (${{ matrix.arch }})
    needs: verify
    if: github.event_name == 'push' || inputs.with_mac
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub 已下线 macos-13 且 macOS 14 镜像已标记 deprecated，arm64 统一用 macos-15、Intel leg 用 macos-15-intel。
          # 若该镜像未来下线，换当时的 Intel 镜像（同步 packaging/README.md）。
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}
          workspaces: |
            . -> target
            app -> target
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Check signing and notarization secrets
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MAC_NOTARY_API_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.MAC_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          missing=()
          if [[ -z "$P12" ]]; then missing+=("MAC_CERT_P12_BASE64"); fi
          if [[ -z "$PASSWORD" ]]; then missing+=("MAC_CERT_PASSWORD"); fi
          if [[ -z "$IDENTITY" ]]; then missing+=("MAC_SIGN_IDENTITY"); fi
          if [[ -z "$NOTARY_KEY_ID" ]]; then missing+=("MAC_NOTARY_API_KEY_ID"); fi
          if [[ -z "$NOTARY_ISSUER_ID" ]]; then missing+=("MAC_NOTARY_API_ISSUER_ID"); fi
          if [[ -z "$NOTARY_KEY_P8" ]]; then missing+=("MAC_NOTARY_API_KEY_P8_BASE64"); fi
          if (( ${#missing[@]} > 0 )); then
            echo "::error::缺少 macOS 签名/公证 secrets：${missing[*]}"
            echo "请在仓库 Settings → Secrets and variables → Actions 配置以下 6 项："
            echo "  MAC_CERT_P12_BASE64          Developer ID Application 证书 p12（base64，含完整链）"
            echo "  MAC_CERT_PASSWORD            p12 口令"
            echo "  MAC_SIGN_IDENTITY            签名身份全名（Developer ID Application: <姓名> (<TeamID>)）"
            echo "  MAC_NOTARY_API_KEY_ID        App Store Connect API key id"
            echo "  MAC_NOTARY_API_ISSUER_ID     App Store Connect issuer id"
            echo "  MAC_NOTARY_API_KEY_P8_BASE64 API key 的 .p8 私钥（base64）"
            echo "说明见 packaging/README.md 与 docs/adr/0011-mac-desktop-packaging-and-signing.md。"
            echo "只想出 Linux/Windows 产物可手动触发并关闭 with_mac。"
            exit 1
          fi
      - name: Import signing identity into temporary keychain
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/solidway-signing.keychain-db"
          keychain_pass="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_pass" "$keychain" >/dev/null
          security list-keychains -d user | tr -d '"' | \
            xargs security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build and sign app
        env:
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: ./scripts/package-mac.sh
      - name: Verify signature
        run: |
          set -euo pipefail
          app="$(ls -d dist/mac/*.app)"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Authority|flags='
      - name: Notarize and staple
        env:
          MAC_NOTARY_API_KEY_ID: ${{ secrets.MAC_NOTARY_API_KEY_ID }}
          MAC_NOTARY_API_ISSUER_ID: ${{ secrets.MAC_NOTARY_API_ISSUER_ID }}
          MAC_NOTARY_API_KEY_P8: ${{ runner.temp }}/notary-key.p8
          MAC_NOTARY_API_KEY_P8_BASE64: ${{ secrets.MAC_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$MAC_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$MAC_NOTARY_API_KEY_P8"
          ./scripts/notarize-mac.sh
      # 独立兜底闸门：不依赖 notarize-mac.sh 的退出语义（bash 3.2 的 EXIT trap
      # 会把 unbound variable 的退出码吞成 0）。上传前重新验收最终 dmg：
      # dmg 本体只做 stapler validate；spctl 验收挂载后的 dmg 内 .app。
      - name: Verify notarized dmg
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist/mac/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "::error::期望恰好 1 个 dmg，实际 ${#dmgs[@]} 个"
            exit 1
          fi
          dmg="${dmgs[0]}"
          echo "验收 dmg: $dmg"
          # stapler（validate）会走 CloudKit 联网，可能撞上瞬时网络错误
          # （Error 65/68、NSURLError、connection lost 等）；仅网络类失败重试
          # 首次 + 3 次（间隔 20s）；非网络态直接失败。
          stapler_retryable() {
            local rc="$1"
            local output="$2"
            if [[ "$rc" -eq 65 || "$rc" -eq 68 ]]; then
              return 0
            fi
            grep -qiE 'NSURLError|connection lost|-1005|timed out|Error 6[58]|network' <<<"$output"
          }
          stapler_retry() {
            local action="$1"
            local target="$2"
            local attempt=1
            local max_attempts=4
            local delay="${STAPLER_RETRY_DELAY:-20}"
            local output=""
            local rc=0
            while (( attempt <= max_attempts )); do
              rc=0
              output="$(xcrun stapler "$action" "$target" 2>&1)" || rc=$?
              if (( rc == 0 )); then
                if [[ -n "$output" ]]; then
                  printf '%s\n' "$output"
                fi
                return 0
              fi
              printf 'stapler %s 失败（第 %d/%d 次，rc=%d）：%s\n' "$action" "$attempt" "$max_attempts" "$rc" "$output" >&2
              if ! stapler_retryable "$rc" "$output"; then
                return "$rc"
              fi
              if (( attempt == max_attempts )); then
                return "$rc"
              fi
              printf '可重试失败（CloudKit/网络），%s 秒后重试…\n' "$delay" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
            return "$rc"
          }
          if ! stapler_retry validate "$dmg"; then
            echo "::error::dmg stapler validate 失败（重试后仍未通过）"
            exit 1
          fi

          mount_dir="$(mktemp -d "${TMPDIR:-/tmp}/solidway-dmg-verify.XXXXXX")"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" 2>/dev/null || true
          }
          fail() {
            echo "::error::$*" >&2
            cleanup
            exit 1
          }
          if ! hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg" >/dev/null; then
            fail "挂载 dmg 失败"
          fi
          apps=("$mount_dir"/*.app)
          if (( ${#apps[@]} != 1 )); then
            fail "dmg 内应有且仅有 1 个 .app，实际 ${#apps[@]} 个"
          fi
          app="${apps[0]}"
          echo "验收 dmg 内 .app: $app"
          if ! codesign --verify --deep --strict "$app"; then
            fail "dmg 内 .app 签名校验失败"
          fi
          app_output="$(spctl -a -vv "$app" 2>&1 || true)"
          printf '%s\n' "$app_output"
          if ! grep -q 'accepted' <<<"$app_output" || ! grep -q 'source=Notarized Developer ID' <<<"$app_output"; then
            fail "dmg 内 .app 未通过 Gatekeeper 验收（缺少 accepted / source=Notarized Developer ID）"
          fi
          cleanup
      - name: Remove notary API key
        if: always()
        run: rm -f "$RUNNER_TEMP/notary-key.p8"
      # 只有公证、双钉票与 spctl 验收全部通过的 dmg 才会走到这里。
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/mac/*.dmg
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/solidway-signing.keychain-db" 2>/dev/null || true

  windows-app:
    name: windows client (nsis/msi + portable)
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-2022
          workspaces: |
            . -> target
            app -> target
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build client
        shell: bash
        run: ./scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/windows/*
          if-no-files-found: error

  release:
    name: publish release
    needs: [verify, linux-service, linux-app, mac, windows-app]
    # skipped 的 mac job（演练时关闭 with_mac）不阻塞发布；任一产物失败则不发 Release。
    if: >-
      always()
      && (startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.publish))
      && needs.linux-service.result == 'success'
      && needs.linux-app.result == 'success'
      && needs.windows-app.result == 'success'
      && (needs.mac.result == 'success' || needs.mac.result == 'skipped')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Require tag for manual publish
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" && -z "$INPUT_TAG" ]]; then
            echo "::error::手动发布必须提供 tag 输入（如 v0.1.0）。"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release
          # `*/portable/*` 是便携 zip 的展开物（zip 本身已是发布物），不再单独挂到 Release。
          find dist -path '*/portable/*' -prune -o -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' \
               -o -name '*.exe' -o -name '*.msi' -o -name '*.zip' \) \
            -exec cp -v {} release/ \;
          ls -lh release
      - name: Extract release notes from CHANGELOG
        run: ./scripts/release-notes.sh "${{ needs.verify.outputs.version }}" > release-notes.md
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: ${{ format('Solidway v{0}', needs.verify.outputs.version) }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: release/*
